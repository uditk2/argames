<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Relic Hunter — 3D Temple Maze Runner</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <meta name="theme-color" content="#0e0a16" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- PORTAL-NEUTRAL BUILD. Deliberately NO CrazyGames SDK script and NO
         window.__CRAZYGAMES__ flag, so the guarded wrapper stays fully disabled:
         no ads are ever requested, and the rewarded-revive button (gated on
         CG.isEnabled()) never renders as a dead control. Upload this anywhere
         that takes a plain HTML5 bundle — itch.io, Newgrounds, a static host —
         or use it as the base for another portal's SDK. -->

    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/portable-main.jsx"></script>
  </body>
</html>
