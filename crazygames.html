<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Relic Hunter — 3D Temple Maze Runner</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <meta name="theme-color" content="#0e0a16" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Enable the guarded CrazyGames SDK wrapper for THIS build only. Set before
         any module runs so src/games/temple/crazygames/sdk.js sees it. -->
    <script>window.__CRAZYGAMES__ = true;</script>

    <!-- CrazyGames SDK v3. On non-CrazyGames hosts this either 404s or the SDK
         runs in local/demo mode; either way EVERY call in our wrapper is guarded,
         so a missing/erroring SDK never breaks the game. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; -webkit-touch-callout: none; user-select: none; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/crazygames-main.jsx"></script>
  </body>
</html>
