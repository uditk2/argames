<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 200" width="80" height="200">
  <defs>
    <linearGradient id="uaBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12162a"/>
      <stop offset="0.45" stop-color="#2a3158"/>
      <stop offset="1" stop-color="#161a30"/>
    </linearGradient>
    <linearGradient id="uaCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4274"/>
      <stop offset="1" stop-color="#1d2342"/>
    </linearGradient>
  </defs>

  <!-- upper-arm body (shoulder -> elbow) -->
  <path d="M22,40 Q40,30 58,40 L54,176 Q40,188 26,176 Z"
        fill="url(#uaBody)" stroke="#5b6bb0" stroke-width="2.5"/>

  <!-- shoulder pauldron cap -->
  <ellipse cx="40" cy="32" rx="32" ry="26" fill="url(#uaCap)" stroke="#5b6bb0" stroke-width="2.5"/>
  <ellipse cx="40" cy="28" rx="18" ry="12" fill="#4a5494" opacity="0.6"/>

  <!-- cyan energy seam -->
  <path d="M40,50 L40,168" stroke="#57e3ff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- edge highlight -->
  <path d="M28,52 L31,170" stroke="#7a87c8" stroke-width="3.5" opacity="0.45" stroke-linecap="round"/>
  <!-- elbow joint -->
  <circle cx="40" cy="180" r="13" fill="url(#uaCap)" stroke="#5b6bb0" stroke-width="2"/>
</svg>
