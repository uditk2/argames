<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 210" width="84" height="210">
  <defs>
    <linearGradient id="shBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101426"/>
      <stop offset="0.45" stop-color="#262d50"/>
      <stop offset="1" stop-color="#14182e"/>
    </linearGradient>
    <linearGradient id="shBoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39416f"/>
      <stop offset="1" stop-color="#171c36"/>
    </linearGradient>
  </defs>

  <!-- shin body (knee -> ankle) -->
  <path d="M26,30 Q42,20 58,30 L54,158 Q42,168 30,158 Z"
        fill="url(#shBody)" stroke="#5b6bb0" stroke-width="2.5"/>

  <!-- knee cap -->
  <ellipse cx="42" cy="28" rx="20" ry="15" fill="#262d50" stroke="#5b6bb0" stroke-width="2"/>

  <!-- greave plate -->
  <path d="M30,52 Q42,46 54,52 L51,146 Q42,152 33,146 Z" fill="url(#shBoot)" opacity="0.85" stroke="#6b78c0" stroke-width="1.2"/>

  <!-- cyan seam -->
  <path d="M42,44 L42,150" stroke="#57e3ff" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>

  <!-- boot -->
  <path d="M30,156 L54,156 L58,182 Q60,196 46,196 L20,196 Q12,196 14,184 Z"
        fill="url(#shBoot)" stroke="#5b6bb0" stroke-width="2.5"/>
  <!-- toe accent -->
  <path d="M16,186 q14,6 30,2" stroke="#57e3ff" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
