<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Relic Hunter — Recordings</title>
<style>
  :root { --bg:#0e0805; --panel:#1b120a; --edge:#ffb45433; --gold:#ffd99a; --amber:#ffb454; --dim:#c9a878; }
  * { box-sizing: border-box; }
  body { margin:0; background: radial-gradient(120% 90% at 50% -10%, #2a1a0c, #0e0805 60%); color:#f3e7d4;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height:100vh; }
  header { padding:22px 26px 10px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; letter-spacing:.02em; }
  h1 b { color:var(--amber); }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; }
  .spacer { flex:1; }
  button { font: inherit; font-size:13px; font-weight:600; cursor:pointer; border-radius:10px;
           padding:8px 14px; border:1px solid var(--edge); background:rgba(20,14,8,.7); color:var(--gold); transition:.15s; }
  button:hover { filter:brightness(1.2); }
  button.danger { color:#ff8a7a; border-color:#ff6a5244; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:18px; padding:16px 26px 60px; }
  .card { background:var(--panel); border:1px solid var(--edge); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  video { width:100%; display:block; background:#000; aspect-ratio:16/9; object-fit:contain; }
  .meta { padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .name { font-weight:700; font-size:14px; color:var(--gold); word-break:break-all; }
  .facts { font-size:12px; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; }
  .facts span { white-space:nowrap; }
  .row { display:flex; gap:8px; margin-top:6px; }
  .row a, .row button { flex:1; text-align:center; text-decoration:none; }
  .row a { font-size:13px; font-weight:600; border-radius:10px; padding:8px 14px; border:1px solid var(--edge);
           background:rgba(20,14,8,.7); color:var(--gold); }
  .row a:hover { filter:brightness(1.2); }
  .empty { padding:70px 26px; text-align:center; color:var(--dim); }
  .empty code { background:#00000055; padding:2px 7px; border-radius:6px; color:var(--gold); }
  .note { font-size:11.5px; color:#9c8a6a; }
</style>
</head>
<body>
<header>
  <div>
    <h1><b>Relic Hunter</b> — Recordings</h1>
    <div class="sub">Throwaway gameplay clips (IndexedDB). Download the ones you want; clear the rest.</div>
  </div>
  <div class="spacer"></div>
  <button onclick="load()">↻ Refresh</button>
  <button class="danger" onclick="clearAll()">Clear all</button>
</header>
<div id="root"></div>

<script>
const DB_NAME='relichunter-recordings', STORE='clips';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains(STORE)){const os=db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true}); os.createIndex('createdAt','createdAt');}};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function all(){const db=await openDB(); return new Promise((res,rej)=>{const out=[]; const rq=db.transaction(STORE,'readonly').objectStore(STORE).openCursor();
  rq.onsuccess=()=>{const c=rq.result; if(c){out.push(c.value); c.continue();} else {out.sort((a,b)=>b.createdAt-a.createdAt); res(out);}}; rq.onerror=()=>rej(rq.error);});}
async function del(id){const db=await openDB(); return new Promise((res,rej)=>{const rq=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error);});}
async function wipe(){const db=await openDB(); return new Promise((res,rej)=>{const rq=db.transaction(STORE,'readwrite').objectStore(STORE).clear(); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error);});}

function fmtDur(ms){const s=Math.round((ms||0)/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtSize(b){return b>1e6 ? (b/1e6).toFixed(1)+' MB' : Math.round((b||0)/1e3)+' KB';}
function fmtDate(t){const d=new Date(t); return d.toLocaleString();}

let urls=[];
async function load(){
  urls.forEach(u=>URL.revokeObjectURL(u)); urls=[];
  const root=document.getElementById('root');
  let clips=[]; try{ clips=await all(); }catch(e){ root.innerHTML='<div class="empty">Could not open the recordings store.<br>'+e+'</div>'; return; }
  if(!clips.length){ root.innerHTML='<div class="empty">No recordings yet.<br><br>In the game (localhost) open with <code>?record=1</code>, press <code>R</code> or the <b>REC</b> button to capture a run, then come back here.</div>'; return; }
  const grid=document.createElement('div'); grid.className='grid';
  for(const c of clips){
    const url=URL.createObjectURL(c.blob); urls.push(url);
    const res=(c.w&&c.h)?(c.w+'×'+c.h):'';
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=
      '<video src="'+url+'" controls preload="metadata"></video>'+
      '<div class="meta">'+
        '<div class="name">'+c.name+'</div>'+
        '<div class="facts"><span>⏱ '+fmtDur(c.durationMs)+'</span><span>▪ '+fmtSize(c.size)+'</span>'+(res?'<span>▪ '+res+'</span>':'')+'<span>▪ '+fmtDate(c.createdAt)+'</span></div>'+
        '<div class="row">'+
          '<a href="'+url+'" download="'+c.name+'.webm">⬇ Download</a>'+
          '<button class="danger" data-id="'+c.id+'">Delete</button>'+
        '</div>'+
      '</div>';
    card.querySelector('button.danger').onclick=async()=>{ await del(c.id); load(); };
    grid.appendChild(card);
  }
  root.innerHTML=''; root.appendChild(grid);
}
async function clearAll(){ if(!confirm('Delete ALL recordings? This cannot be undone.')) return; await wipe(); load(); }
load();
</script>
</body>
</html>
